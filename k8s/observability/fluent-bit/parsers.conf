# Parser padrão para logs do Docker daemon (formato JSON com campo "log")
[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

# Parser para desempacotar o campo "log" como JSON estruturado
# Captura os campos: level, msg/message, trace_id, span_id, logger, timestamp etc.
[PARSER]
    Name        json_message
    Format      json
    Time_Key    ts
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z

[PARSER]
    Name        springboot
    Format      regex
    # Matches Spring Boot logs with or without ANSI colors
    Regex       /^(?:\x1b\[\d+m)?(?<log_timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.?\d*)(?:\x1b\[[0-9;]+m)?\s+(?:\x1b\[\d+m)?\[(?<thread>[^\]]*)\](?:\x1b\[[0-9;]+m)?\s+(?:\x1b\[\d+m)?(?<level>[A-Z ]{5})(?:\x1b\[[0-9;]+m)?\s+(?:\x1b\[\d+m)?(?<logger>[^\s\x1b]+)(?:\x1b\[[0-9;]+m)?\s+-\s+(?<message>.*)$/
    Time_Key    log_timestamp
    Time_Format %Y-%m-%d %H:%M:%S
    Time_Keep   On





[PARSER]
    Name        springboot_json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On




[PARSER]
    Name        python
    Format      regex
    Regex       /^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) - (?<logger>.*) - (?<level>[A-Z]*) - \[(?<trace_id>[a-f0-9]*):(?<span_id>[a-f0-9]*)\] - \[(?<location>.*)\] - (?<message>.*)$/
