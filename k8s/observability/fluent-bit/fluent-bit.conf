[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/*.log
    Parser            docker
    DB                /var/log/flb_kube.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  10

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           On
    Merge_Log_Key       log_processed
    K8S-Logging.Parser  On
    K8S-Logging.Exclude Off

[FILTER]
    Name          grep
    Match         kube.*
    Regex         $kubernetes['namespace_name'] ^(marketplace|kafka)$

[FILTER]
    Name          parser
    Match         kube.var.log.containers.*_marketplace_*-service-*.log
    Key_Name      log
    Parser        springboot_json
    Parser        springboot
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name          parser
    Match         kube.var.log.containers.*_marketplace_ml-ranking-service-*.log
    Key_Name      log
    Parser        python
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name          parser
    Match         kube.var.log.containers.*_marketplace_ml-embedding-service-*.log
    Key_Name      log
    Parser        python
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name          parser
    Match         kube.var.log.containers.*_marketplace_api-gateway-*.log
    Key_Name      log
    Parser        json_message
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name          lua
    Match         kube.*
    Script        /fluent-bit/etc/cleanup.lua
    Call          cleanup_log

[FILTER]
    Name          grep
    Match         *
    Exclude       log actuator/health
    Exclude       log /_cluster/health
    Exclude       message Request received

[FILTER]
    Name          record_modifier
    Match         kube.*
    Record        environment production
    Record        stack marketplace-search-system

[OUTPUT]
    Name                  opensearch
    Match                 kube.*
    Host                  opensearch.observability.svc.cluster.local
    Port                  9200
    Index                 marketplace-logs
    Logstash_Format       On
    Logstash_Prefix       marketplace-logs
    Logstash_DateFormat   %Y.%m.%d
    Buffer_Size           5M
    Generate_ID           On
    Retry_Limit           False
    tls                   Off
    tls.verify            Off
    Suppress_Type_Name    On
    Trace_Error           On
    Trace_Output          Off
    Workers               2
