apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: marketplace
  labels:
    app: search-service
spec:
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/api/v1/actuator/prometheus"
      labels:
        app: search-service
    spec:
      containers:
      - name: search-service
        image: registry:5000/pablords/search-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
        resources:
          requests:
            cpu: 400m
            memory: 512Mi
          limits:
            memory: 1024Mi
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: OPENSEARCH_HOST
          value: "opensearch.observability.svc.cluster.local"
        - name: OPENSEARCH_PORT
          value: "9200"
        - name: REDIS_HOST
          value: "redis.marketplace.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: EMBEDDING_SERVICE_URL
          value: "http://ml-embedding-service.marketplace.svc.cluster.local:8085"
        - name: ML_RANKING_SERVICE_URL
          value: "http://ml-ranking-service.marketplace.svc.cluster.local:8084"
        - name: OTEL_SERVICE_NAME
          value: "search-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.observability.svc.cluster.local:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_METRICS_EXPORTER
          value: "none"
        - name: OTEL_LOGS_EXPORTER
          value: "none"
        - name: OTEL_INSTRUMENTATION_SERVLET_SUPPRESS_SPANS_FOR_PATHS
          value: "/api/v1/actuator,/api/v1/actuator/*,/actuator,/actuator/*,/health,/metrics,/api/v1/health,/api/v1/metrics"
        - name: OTEL_INSTRUMENTATION_HTTP_SERVER_EXCLUDED_PATHS
          value: "/api/v1/actuator,/api/v1/actuator/*,/actuator,/actuator/*,/health,/metrics,/api/v1/health,/api/v1/metrics"
        - name: LOG_LEVEL
          value: "INFO"
        - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_ACTUATE_AUTOCONFIGURE_TRACING
          value: "DEBUG"
        - name: LOGGING_LEVEL_IO_MICROMETER_TRACING
          value: "DEBUG"
        - name: LOGGING_LEVEL_IO_OPENTELEMETRY
          value: "DEBUG"
        - name: LOG_LEVEL_ML
          value: "INFO"
        - name: LOG_LEVEL_FEATURE_STORE
          value: "INFO"
        - name: ENVIRONMENT
          value: "production"
        - name: SPRING_OUTPUT_ANSI_ENABLED
          value: "NEVER"
        - name: OTEL_INSTRUMENTATION_METHODS_INCLUDE
          value: "com.marketplace.search.search.domain.services.SearchDomainService[smartSearch,fetchAndValidateCandidates,applyBusinessRules,calculateBusinessBoost,searchWithFallback];com.marketplace.search.search.application.usecases.SearchProductsUseCase[execute];com.marketplace.search.search.infrastructure.opensearch.repositories.OpenSearchProductSearchRepository[search,searchCandidatesWithScores];com.marketplace.search.search.infrastructure.ml.MlRankingClient[rank];com.marketplace.search.search.infrastructure.embedding.EmbeddingClient[getEmbedding]"
        startupProbe:
          httpGet:
            path: /api/v1/actuator/health
            port: 8083
          failureThreshold: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/actuator/health
            port: 8083
          initialDelaySeconds: 0
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/actuator/health
            port: 8083
          initialDelaySeconds: 0
          periodSeconds: 15
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: marketplace
spec:
  selector:
    app: search-service
  ports:
  - port: 8083
    targetPort: 8083
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: search-service-hpa
  namespace: marketplace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
