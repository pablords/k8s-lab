apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: marketplace
  labels:
    app: catalog-service
spec:
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/api/v1/actuator/prometheus"
      labels:
        app: catalog-service
    spec:
      containers:
      - name: catalog-service
        image: 192.168.49.5:5000/pablords/catalog-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "50"
        
        # 1. Parâmetro Exclusivo do Spring (Cluster multi-host com tuning de alta performance)
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://catalog-db-0.catalog-db.marketplace.svc.cluster.local:5432/catalog?reWriteBatchedInserts=true"

        # 2. Parâmetros Atômicos do Banco (Lidos tanto para fallbacks quanto pelo Debezium)
        - name: DB_HOSTNAME
          value: "catalog-db-0.catalog-db.marketplace.svc.cluster.local"
        - name: DB_HOSTNAME_CONTAINER
          value: "catalog-db-0.catalog-db.marketplace.svc.cluster.local" # Fixo no Master para replicação lógica do WAL
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: "catalog"
        - name: POSTGRES_PASSWORD
          value: "catalog"
        
        # 3. Nome puro do banco exigido pelo Debezium (Acaba com o Read timed out no Kafka Connect)
        - name: DEBEZIUM_DB_NAME
          value: "catalog"

        # 4. Integração com outros componentes da arquitetura
        - name: DEBEZIUM_CONNECTOR_URL
          value: "http://kafka-connect.marketplace.svc.cluster.local:8083/connectors"
        - name: POSTGRES_TABLES
          value: "public.products,public.product_metrics,public.brands,public.categories,public.sellers"
        - name: REDIS_HOST
          value: "redis.marketplace.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        
        # Observabilidade e Telemetria (OpenTelemetry)
        - name: OTEL_SERVICE_NAME
          value: "catalog-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.observability.svc.cluster.local:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_METRICS_EXPORTER
          value: "none"
        - name: OTEL_LOGS_EXPORTER
          value: "none"
        - name: SPRING_OUTPUT_ANSI_ENABLED
          value: "NEVER"
        - name: OTEL_INSTRUMENTATION_METHODS_INCLUDE
          value: "com.marketplace.search.catalog.application.usecases.CreateProductUseCase[execute]"
        - name: OTEL_INSTRUMENTATION_SERVLET_SUPPRESS_SPANS_FOR_PATHS
          value: "/api/v1/actuator,/api/v1/actuator/*,/actuator,/actuator/*,/health,/metrics,/api/v1/health,/api/v1/metrics"
        - name: OTEL_INSTRUMENTATION_HTTP_SERVER_EXCLUDED_PATHS
          value: "/api/v1/actuator,/api/v1/actuator/*,/actuator,/actuator/*,/health,/metrics,/api/v1/health,/api/v1/metrics"
        
        startupProbe:
          httpGet:
            path: /api/v1/actuator/health/liveness
            port: 8081
          failureThreshold: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/actuator/health/liveness
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/actuator/health/readiness
            port: 8081
          initialDelaySeconds: 0
          periodSeconds: 15
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: marketplace
spec:
  selector:
    app: catalog-service
  ports:
  - port: 8081
    targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-service-hpa
  namespace: marketplace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70