apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: marketplace
  labels:
    app: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/api/v1/actuator/prometheus"
      labels:
        app: catalog-service
    spec:
      containers:
      - name: catalog-service
        image: marketplace/catalog-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: DB_HOSTNAME
          value: "catalog-db.marketplace.svc.cluster.local"
        - name: DB_HOSTNAME_CONTAINER
          value: "catalog-db.marketplace.svc.cluster.local"
        - name: DEBEZIUM_CONNECTOR_URL
          value: "http://kafka-connect.marketplace.svc.cluster.local:8083/connectors"
        - name: POSTGRES_TABLES
          value: "public.products,public.product_metrics,public.brands,public.categories,public.sellers"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: "catalog"
        - name: POSTGRES_PASSWORD
          value: "catalog"
        - name: POSTGRES_DB
          value: "catalog"
        - name: REDIS_HOST
          value: "redis.marketplace.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: OTEL_SERVICE_NAME
          value: "catalog-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.observability.svc.cluster.local:4317"
        - name: OTEL_METRICS_EXPORTER
          value: "none"
        - name: OTEL_LOGS_EXPORTER
          value: "none"
        - name: OTEL_INSTRUMENTATION_METHODS_INCLUDE
          value: "com.marketplace.search.catalog.application.usecases.CreateProductUseCase[execute]"
        - name: OTEL_HTTP_SERVER_EXCLUDED_PATHS
          value: "/actuator/prometheus,/actuator/health"
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "30"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "5"
        - name: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
          value: "30000"
        - name: SPRING_OUTPUT_ANSI_ENABLED
          value: "NEVER"
        livenessProbe:
          httpGet:
            path: /api/v1/actuator/health
            port: 8081
          initialDelaySeconds: 40
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: marketplace
spec:
  selector:
    app: catalog-service
  ports:
  - port: 8081
    targetPort: 8081
