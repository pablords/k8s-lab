apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: marketplace
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: pablords/api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: CATALOG_SERVICE_URL
          value: "http://catalog-service.marketplace.svc.cluster.local:8081"
        - name: SEARCH_SERVICE_URL
          value: "http://search-service.marketplace.svc.cluster.local:8083"
        - name: CATALOG_SERVICE_TIMEOUT
          value: "2000"
        - name: SEARCH_SERVICE_TIMEOUT
          value: "3000"
        - name: CATALOG_SERVICE_CB_FAILURE_RATE_THRESHOLD
          value: "30"
        - name: SEARCH_SERVICE_CB_FAILURE_RATE_THRESHOLD
          value: "30"
        - name: CATALOG_SERVICE_CB_SLIDING_WINDOW_SIZE
          value: "20"
        - name: SEARCH_SERVICE_CB_SLIDING_WINDOW_SIZE
          value: "20"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: marketplace
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
