apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: marketplace
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/api/v1/metrics"
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: marketplace/api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: CATALOG_SERVICE_BASE_URL
          value: "http://catalog-service.marketplace.svc.cluster.local:8081/api/v1"
        - name: SEARCH_SERVICE_BASE_URL
          value: "http://search-service.marketplace.svc.cluster.local:8083/api/v1"
        - name: CATALOG_SERVICE_TIMEOUT
          value: "2000"
        - name: SEARCH_SERVICE_TIMEOUT
          value: "3000"
        - name: CATALOG_SERVICE_CB_FAILURE_RATE_THRESHOLD
          value: "30"
        - name: SEARCH_SERVICE_CB_FAILURE_RATE_THRESHOLD
          value: "30"
        - name: CATALOG_SERVICE_CB_SLIDING_WINDOW_SIZE
          value: "20"
        - name: SEARCH_SERVICE_CB_SLIDING_WINDOW_SIZE
          value: "20"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: marketplace
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: marketplace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
