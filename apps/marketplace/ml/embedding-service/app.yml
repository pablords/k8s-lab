apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: embedding-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/pablords/k8s-lab.git"
    targetRevision: marketplace
    path: apps/marketplace/ml/embedding-service
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
