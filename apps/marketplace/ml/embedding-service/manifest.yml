apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-embedding-service
  namespace: marketplace
  labels:
    app: ml-embedding-service
spec:
  selector:
    matchLabels:
      app: ml-embedding-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/metrics"
      labels:
        app: ml-embedding-service
    spec:
      nodeName: minikube
      containers:
      - name: ml-embedding-service
        image: registry:5000/pablords/ml-embedding-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8085
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
        env:
        - name: OMP_NUM_THREADS
          value: "1"
        - name: MKL_NUM_THREADS
          value: "1"
        - name: OPENBLAS_NUM_THREADS
          value: "1"
        - name: VECLIB_MAXIMUM_THREADS
          value: "1"
        - name: NUMEXPR_NUM_THREADS
          value: "1"
        - name: REDIS_HOST
          value: "redis.marketplace.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: OPENSEARCH_HOST
          value: "opensearch.observability.svc.cluster.local"
        - name: OPENSEARCH_PORT
          value: "9200"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.observability.svc.cluster.local:4317"
        - name: OTEL_METRICS_EXPORTER
          value: "none"
        - name: OTEL_LOGS_EXPORTER
          value: "none"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8085
          initialDelaySeconds: 60
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ml-embedding-service
  namespace: marketplace
spec:
  selector:
    app: ml-embedding-service
  ports:
  - port: 8085
    targetPort: 8085
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-embedding-service-hpa
  namespace: marketplace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-embedding-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
