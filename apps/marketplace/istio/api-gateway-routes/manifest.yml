apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: api-gateway
  namespace: marketplace
spec:
  hosts:
  - "api.lab.com.br"
  gateways:
  - istio-system/ingress-gateway 
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: api-gateway.marketplace.svc.cluster.local 
        port:
          number: 8080
