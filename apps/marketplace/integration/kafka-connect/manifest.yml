apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: marketplace
  labels:
    app: kafka-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      initContainers:
      - name: download-avro-converter
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          cd /shared
          CONFLUENT_VERSION=7.5.0
          jars="kafka-connect-avro-converter kafka-connect-avro-data kafka-avro-serializer kafka-schema-serializer kafka-schema-registry-client common-config common-utils"
          for jar in $jars; do
            if [ ! -f "${jar}-${CONFLUENT_VERSION}.jar" ]; then
              echo "Downloading ${jar}..."
              wget -q https://packages.confluent.io/maven/io/confluent/${jar}/${CONFLUENT_VERSION}/${jar}-${CONFLUENT_VERSION}.jar
            fi
          done
          if [ ! -f "avro-1.11.3.jar" ]; then
            echo "Downloading avro..."
            wget -q https://repo1.maven.org/maven2/org/apache/avro/avro/1.11.3/avro-1.11.3.jar
          fi
          if [ ! -f "guava-32.1.3-jre.jar" ]; then
            echo "Downloading guava..."
            wget -q https://repo1.maven.org/maven2/com/google/guava/guava/32.1.3-jre/guava-32.1.3-jre.jar
          fi
          if [ ! -f "failureaccess-1.0.1.jar" ]; then
            echo "Downloading failureaccess..."
            wget -q https://repo1.maven.org/maven2/com/google/guava/failureaccess/1.0.1/failureaccess-1.0.1.jar
          fi
          if [ ! -f "kafka-schema-converter-7.5.0.jar" ]; then
            echo "Downloading schema converter..."
            wget -q https://packages.confluent.io/maven/io/confluent/kafka-schema-converter/7.5.0/kafka-schema-converter-7.5.0.jar
          fi
        volumeMounts:
        - name: connect-plugins
          mountPath: /shared
      containers:
      - name: kafka-connect
        image: debezium/connect:2.6.0.Final
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        env:
        - name: BOOTSTRAP_SERVERS
          value: "kafka-0.kafka-hs.kafka.svc.cluster.local:9092,kafka-1.kafka-hs.kafka.svc.cluster.local:9092,kafka-2.kafka-hs.kafka.svc.cluster.local:9092"
        - name: GROUP_ID
          value: "debezium-connect"
        - name: CONFIG_STORAGE_TOPIC
          value: "connect_configs"
        - name: OFFSET_STORAGE_TOPIC
          value: "connect_offsets"
        - name: STATUS_STORAGE_TOPIC
          value: "connect_status"
        - name: CONFIG_STORAGE_REPLICATION_FACTOR
          value: "3"
        - name: OFFSET_STORAGE_REPLICATION_FACTOR
          value: "3"
        - name: STATUS_STORAGE_REPLICATION_FACTOR
          value: "3"
        - name: CONNECT_BOOTSTRAP_SERVERS
          value: "kafka-0.kafka-hs.kafka.svc.cluster.local:9092,kafka-1.kafka-hs.kafka.svc.cluster.local:9092,kafka-2.kafka-hs.kafka.svc.cluster.local:9092"
        - name: CONNECT_GROUP_ID
          value: "debezium-connect"
        - name: CONNECT_CONFIG_STORAGE_TOPIC
          value: "connect_configs"
        - name: CONNECT_OFFSET_STORAGE_TOPIC
          value: "connect_offsets"
        - name: CONNECT_STATUS_STORAGE_TOPIC
          value: "connect_status"
        - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
          value: "3"
        - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
          value: "3"
        - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
          value: "3"
        - name: CONNECT_REST_ADVERTISED_HOST_NAME
          value: "kafka-connect"
        - name: CONNECT_REST_ADVERTISED_PORT
          value: "8083"
        - name: CONNECT_REST_HOST_NAME
          value: "0.0.0.0"
        - name: CONNECT_REST_PORT
          value: "8083"
        - name: CONNECT_KEY_CONVERTER
          value: "io.confluent.connect.avro.AvroConverter"
        - name: CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL
          value: "http://schema-registry.kafka.svc.cluster.local:8081"
        - name: CONNECT_VALUE_CONVERTER
          value: "io.confluent.connect.avro.AvroConverter"
        - name: CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL
          value: "http://schema-registry.kafka.svc.cluster.local:8081"
        - name: CONNECT_PLUGIN_PATH
          value: "/kafka/connect"
        livenessProbe:
          httpGet:
            path: /
            port: 8083
          initialDelaySeconds: 120
          periodSeconds: 30
        volumeMounts:
        - name: connect-plugins
          mountPath: /kafka/connect/confluent-avro-converter
      volumes:
      - name: connect-plugins
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: marketplace
spec:
  selector:
    app: kafka-connect
  ports:
  - port: 8083
    targetPort: 8083
